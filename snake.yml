# 贡献贪吃蛇动画
# 放置路径: .github/workflows/snake.yml（yiktt/yiktt 仓库内）
# 启用后取消 README.md 底部 snake 注释即可显示

name: generate-snake

on:
  schedule:
    - cron: "0 */12 * * *" # 每 12 小时刷新一次
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake from contributions
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: yiktt
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
